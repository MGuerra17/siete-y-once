name: Mobile build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: Submit to the stores when the build finishes (production only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: EAS ${{ inputs.profile }} (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build on EAS
        run: >
          eas build --non-interactive --no-wait
          --profile ${{ inputs.profile }}
          --platform ${{ inputs.platform }}
          ${{ inputs.submit && inputs.profile == 'production' && '--auto-submit' || '' }}
