name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - apps/backend/**
      - packages/game-core/**
      - packages/protocol/**
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-backend-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC: short-lived AWS credentials, no stored keys
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.stage || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect "prod" with required reviewers in Settings → Environments.
    environment: ${{ inputs.stage || 'dev' }}
    env:
      STAGE: ${{ inputs.stage || 'dev' }}
      # Only prod alarms send e-mail; AWS asks the address to confirm the subscription once.
      ALARM_EMAIL: ${{ inputs.stage == 'prod' && vars.ALARM_EMAIL || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @seven/backend --filter @seven/game-core test
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: CDK diff
        run: pnpm backend run diff -c stage=$STAGE -c alarmEmail=$ALARM_EMAIL
      - name: CDK deploy
        # `run` is required: `pnpm deploy` is a built-in pnpm command.
        run: pnpm backend run deploy -c stage=$STAGE -c alarmEmail=$ALARM_EMAIL --require-approval never
